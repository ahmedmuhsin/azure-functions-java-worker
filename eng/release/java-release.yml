# Releases Azure Functions Java libraries to Maven Central and GitHub.
# Replaces the Azure SDK "java - partner-release" pipeline (azure-sdk/internal 1809).
#
# Stages
#   Build    one job per library, each with its own steps, producing drop-<id>
#   Sign     ESRP jar signing (CP-447347-Java) unless javaSigning is gpg-only, then GPG and checksums
#   Approve  manual review of drops, release notes and the exact commits
#   Publish  ESRP Maven release, one EsrpRelease task per library
#   GitHub   waits for Maven Central, then creates <artifactId>-<version> tags and GitHub releases
# With publish false the run stops after Sign, so it is a full dry run of build, notes and signing.

trigger: none
pr: none

parameters:
  - name: releases
    displayName: Libraries to release. id is a file name under eng/release/libraries. commit is a full SHA.
    type: object
    default:
      - id: core-library
        version: 0.0.0
        commit: ''
  - name: javaSigning
    displayName: Jar signing
    type: string
    default: esrp
    values:
      - esrp
      - gpg-only
  - name: publish
    displayName: Publish to Maven Central and GitHub
    type: boolean
    default: false

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release
    # Internal mirrors of the GitHub repos, the same sources the official library builds use.
    - repository: java-library
      type: git
      name: internal/azure.azure-functions-java-library
      ref: refs/heads/dev
    - repository: java-additions
      type: git
      name: internal/azure.azure-functions-java-additions
      ref: refs/heads/dev

variables:
  - template: ci/variables/cfs.yml@eng
  - group: azure-functions-java-release    # GpgPassphrase, EsrpOwners, EsrpApprovers
  - group: github-app-resources            # GitHubAppId, GitHubInstallationId, GitHubKeyVaultKeyId
  - name: gpgKeySecureFile
    value: azure-functions-java-release.gpg

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    settings:
      networkIsolationPolicy: DefaultDeny,CFSClean,CFSClean2,CFSClean3
    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux

    stages:
      - stage: Build
        jobs:
          - ${{ each lib in parameters.releases }}:
            - template: /eng/release/libraries/${{ lib.id }}.yml@self
              parameters:
                version: ${{ lib.version }}
                commit: ${{ lib.commit }}

      - stage: Sign
        dependsOn: Build
        jobs:
          - job: Sign
            displayName: Sign (${{ parameters.javaSigning }})
            templateContext:
              inputs:
                - ${{ each lib in parameters.releases }}:
                  - input: pipelineArtifact
                    artifactName: drop-${{ lib.id }}
                    targetPath: $(Pipeline.Workspace)/drops/${{ lib.id }}
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Pipeline.Workspace)/publish
                  artifactName: publish
                # Release jobs cannot check out source, so they get the scripts from this artifact.
                - output: pipelineArtifact
                  targetPath: $(Build.SourcesDirectory)/eng/release/scripts
                  artifactName: release-scripts
            steps:
              - checkout: self
              - ${{ if eq(parameters.javaSigning, 'esrp') }}:
                - template: ci/sign-files.yml@eng
                  parameters:
                    displayName: Jar sign (CP-447347-Java)
                    folderPath: $(Pipeline.Workspace)/drops
                    pattern: '**/*.jar'
                    minimatch: true
                    signType: inline
                    inlineOperation: |
                      [
                        {
                          "KeyCode": "CP-447347-Java",
                          "OperationCode": "JavaSign",
                          "Parameters": {
                            "SigAlg": "SHA256withRSA",
                            "Timestamp": "-tsa http://sha256timestamp.ws.digicert.com/sha256/timestamp"
                          },
                          "ToolName": "sign",
                          "ToolVersion": "1.0"
                        },
                        {
                          "KeyCode": "CP-447347-Java",
                          "OperationCode": "JavaVerify",
                          "Parameters": {},
                          "ToolName": "sign",
                          "ToolVersion": "1.0"
                        }
                      ]
              - task: DownloadSecureFile@1
                name: gpgKey
                displayName: Download GPG key
                inputs:
                  secureFile: $(gpgKeySecureFile)
              - pwsh: |
                  & '$(Build.SourcesDirectory)/eng/release/scripts/Sign-MavenDrop.ps1' `
                    -DropRoot '$(Pipeline.Workspace)/drops' -OutputRoot '$(Pipeline.Workspace)/publish' `
                    -GpgKeyFile '$(gpgKey.secureFilePath)' -VerifyJarSignature:$${{ eq(parameters.javaSigning, 'esrp') }}
                displayName: GPG sign and checksum
                env:
                  GPG_PASSPHRASE: $(GpgPassphrase)

      - ${{ if parameters.publish }}:
        - stage: Approve
          dependsOn: Sign
          jobs:
            - job: Approve
              pool: server
              timeoutInMinutes: 1440
              steps:
                - task: ManualValidation@1
                  inputs:
                    notifyUsers: $(EsrpApprovers)
                    approvers: $(EsrpApprovers)
                    allowApproversToApproveTheirOwnRuns: false
                    instructions: >-
                      Check each drop-<id> artifact. release.json has the version and commit,
                      release-notes.md has the GitHub release notes. Approving publishes to Maven Central.

        - stage: Publish
          dependsOn: Approve
          jobs:
            - job: Publish
              templateContext:
                type: releaseJob
                isProduction: true
                inputs:
                  - input: pipelineArtifact
                    artifactName: publish
                    targetPath: $(Pipeline.Workspace)/publish
              steps:
                - ${{ each lib in parameters.releases }}:
                  - task: EsrpRelease@12
                    displayName: Publish ${{ lib.id }} ${{ lib.version }} to Maven Central
                    inputs:
                      connectedservicename: azfunc-internal-esrp-prod
                      usemanagedidentity: true
                      keyvaultname: kv-azfunc-esrp-prod
                      signcertname: esrp-release
                      clientid: a31bf239-3e15-498e-a335-f6ec0c9d9ccf
                      intent: PackageDistribution
                      contenttype: Maven
                      contentsource: Folder
                      folderlocation: $(Pipeline.Workspace)/publish/${{ lib.id }}
                      waitforreleasecompletion: true
                      owners: $(EsrpOwners)
                      approvers: $(EsrpApprovers)
                      serviceendpointurl: https://api.esrp.microsoft.com
                      mainpublisher: ESRPRELPACMAN
                      domaintenantid: 33e01921-4d64-4f8c-a055-5bdaffd5e33d

        - stage: GitHub
          dependsOn: Publish
          jobs:
            - job: GitHub
              timeoutInMinutes: 300
              templateContext:
                type: releaseJob
                isProduction: true
                inputs:
                  - input: pipelineArtifact
                    artifactName: release-scripts
                    targetPath: $(Pipeline.Workspace)/scripts
                  - ${{ each lib in parameters.releases }}:
                    - input: pipelineArtifact
                      artifactName: drop-${{ lib.id }}
                      targetPath: $(Pipeline.Workspace)/drops/${{ lib.id }}
              steps:
                - template: ci/internal/fetch-github-access-token.yml@eng
                  parameters:
                    serviceConnection: azfunc-internal-release
                    repositories:
                      - azure-functions-java-library
                      - azure-functions-java-additions
                    permissions:
                      contents: write
                - pwsh: |
                    foreach ($drop in Get-ChildItem '$(Pipeline.Workspace)/drops' -Directory) {
                      $m = Get-Content (Join-Path $drop.FullName 'release.json') -Raw | ConvertFrom-Json
                      & '$(Pipeline.Workspace)/scripts/New-GitHubRelease.ps1' `
                        -GitHubRepo $m.gitHubRepo -GroupId $m.groupId -ArtifactId $m.artifactId -Version $m.version `
                        -Commit $m.commit -MakeLatest ([bool]$m.makeLatest) -WaitForCentralMinutes 240 `
                        -NotesFile (Join-Path $drop.FullName 'release-notes.md')
                    }
                  displayName: Create tags and GitHub releases
                  env:
                    GH_TOKEN: $(GITHUB_ACCESS_TOKEN)
