# azure-functions-java-core-library. Add library specific build steps under preBuildSteps.
parameters:
  - name: version
    type: string
  - name: commit
    type: string

jobs:
  - template: /eng/release/templates/build-library.yml@self
    parameters:
      id: core-library
      version: ${{ parameters.version }}
      commit: ${{ parameters.commit }}
      repository: java-additions
      gitHubRepo: Azure/azure-functions-java-additions
      artifactId: azure-functions-java-core-library
      modulePath: azure-functions-java-core-library
      legacyTagPattern: '^(?:core-library-)?(\d+\.\d+\.\d+)$'
      makeLatest: false
      jdk: '11'
